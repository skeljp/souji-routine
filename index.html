<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>そうじルーティン</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="./icons/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="theme-color" id="themeColorMeta" content="#5F8265">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="そうじ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  (function(){
    var hour = Number(new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Tokyo",hour:"numeric",hourCycle:"h23"}).format(new Date()));
    var isDark = (hour >= 18 || hour < 6);
    document.documentElement.dataset.theme = isDark ? "dark" : "light";
    document.getElementById("themeColorMeta").setAttribute("content", isDark ? "#1C1B17" : "#5F8265");
  })();
</script>
<style>
  :root{
    --paper:#F7F4EC;
    --ink:#2E2C26;
    --ink-soft:#6B6858;
    --line:#DCD5C2;
    --sage:#5F8265;
    --sage-soft:#E4EDE2;
    --clay:#C17A54;
    --clay-soft:#F3E4D8;
    --slate:#5B7C99;
    --slate-soft:#E2E9EF;
    --white:#FFFFFF;
    --thead-bg:#F1EDE1;
    --hover-bg:#FBF9F3;
  }
  :root[data-theme="dark"]{
    --paper:#1C1B17;
    --ink:#EDE8DC;
    --ink-soft:#A79E8C;
    --line:#3A362C;
    --sage:#84AC8B;
    --sage-soft:#28332A;
    --clay:#DB9468;
    --clay-soft:#3B2A20;
    --slate:#8AAAC4;
    --slate-soft:#24303A;
    --white:#26241F;
    --thead-bg:#2C2A24;
    --hover-bg:#2F2D26;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    line-height:1.6;
    padding:32px 16px 64px;
    transition:background .3s ease, color .3s ease;
  }
  .wrap{max-width:760px;margin:0 auto;}

  header{margin-bottom:28px;}
  .eyebrow{
    font-size:12px;
    letter-spacing:.12em;
    color:var(--ink-soft);
    text-transform:uppercase;
    margin-bottom:6px;
  }
  .title-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:4px;
  }
  h1{
    font-size:26px;
    margin:0;
    font-weight:700;
    min-width:0;
  }
  .today-date{
    font-size:14px;
    color:var(--ink-soft);
  }

  .cards{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-bottom:34px;
  }
  /* 週末カードを出す金土日だけ3列にする */
  .cards.with-monthly{grid-template-columns:1fr 1fr 1fr;}
  @media (max-width:520px){
    body{padding:16px 10px 40px;}
    header{margin-bottom:16px;}
    .cards,
    .cards.with-monthly{grid-template-columns:1fr;gap:8px;margin-bottom:18px;}
    .card{padding:14px;}
    td{padding:8px;}
    h1{font-size:21px;}
    footer{margin-top:14px;}
  }
  .card[hidden]{display:none;}
  .card{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:10px;
    padding:20px;
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute;
    left:0;top:0;bottom:0;
    width:4px;
  }
  .card.area::before{background:var(--sage);}
  .card.weekly::before{background:var(--clay);}
  .card.monthly::before{background:var(--slate);}
  .card-label{
    font-size:12px;
    color:var(--ink-soft);
    letter-spacing:.06em;
    margin-bottom:8px;
  }
  .card-label .num{
    display:inline-block;
    background:var(--sage-soft);
    color:var(--sage);
    font-weight:700;
    border-radius:6px;
    padding:1px 8px;
    margin-right:6px;
  }
  .card.weekly .card-label .num{
    background:var(--clay-soft);
    color:var(--clay);
  }
  .card.monthly .card-label .num{
    background:var(--slate-soft);
    color:var(--slate);
  }
  .card-body{
    font-size:16px;
    font-weight:600;
  }

  .table-section{margin-bottom:22px;}
  .table-section:last-of-type{margin-bottom:0;}
  .section-title{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:13px;
    font-weight:600;
    letter-spacing:.04em;
    color:var(--ink-soft);
    margin:0 0 8px;
  }
  .section-title::before{
    content:"";
    width:3px;
    height:13px;
    border-radius:2px;
    background:var(--sage);
  }
  .weekly-section .section-title::before{background:var(--clay);}
  .monthly-section .section-title::before{background:var(--slate);}
  .section-note{
    font-size:11px;
    font-weight:400;
    color:var(--ink-soft);
    opacity:.85;
    margin-left:auto;
  }

  .table-wrap{
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
    background:var(--white);
  }
  table{
    width:100%;
    border-collapse:collapse;
  }
  td{
    padding:10px 12px;
    text-align:left;
    font-size:14px;
    border-bottom:1px solid var(--line);
  }
  tr:last-child td{border-bottom:none;}
  tr.today-row td{background:var(--sage-soft);}
  tr.today-weekday td{background:var(--clay-soft);}
  tr.today-monthly td{background:var(--slate-soft);}
  tr.today-row td.editable,
  tr.today-weekday td.editable,
  tr.today-monthly td.editable{border-radius:0;}
  td.digit-col{
    font-weight:700;
    color:var(--ink-soft);
    width:28px;
    padding-right:4px;
  }
  td.digit-col + td{padding-left:6px;}
  td.weekday-col{width:38px;font-weight:700;padding-right:4px;}
  td.weekday-col + td{padding-left:6px;}

  td.editable{
    cursor:text;
    border-radius:6px;
    font-weight:400;
  }
  td.editable:hover{background:var(--hover-bg);}
  td.editable:focus{
    outline:2px solid var(--sage);
    outline-offset:-2px;
    background:var(--white);
  }
  td.editable:empty::before{
    content:"未設定";
    color:var(--ink-soft);
  }

  td.del-col{width:34px;padding-left:0;padding-right:6px;text-align:right;}
  .del-btn{
    background:none;
    border:none;
    color:var(--ink-soft);
    font-size:15px;
    line-height:1;
    padding:4px 6px;
    border-radius:6px;
    cursor:pointer;
    opacity:.55;
  }
  .del-btn:hover{opacity:1;background:var(--hover-bg);color:var(--clay);}
  .monthly-tools{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    margin-top:8px;
  }
  .add-btn{
    background:var(--white);
    border:1px solid var(--line);
    color:var(--ink-soft);
    font-size:12px;
    padding:6px 12px;
    border-radius:8px;
    cursor:pointer;
  }
  .add-btn:hover{background:var(--thead-bg);color:var(--ink);}
  .epoch-field{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:11px;
    color:var(--ink-soft);
    margin-left:auto;
  }
  .epoch-field input{
    font:inherit;
    font-size:11px;
    color:var(--ink);
    background:var(--white);
    border:1px solid var(--line);
    border-radius:6px;
    padding:4px 6px;
  }

  .refresh-btn{
    background:var(--white);
    border:1px solid var(--line);
    color:var(--ink-soft);
    font-size:12px;
    padding:6px 12px;
    border-radius:8px;
    cursor:pointer;
    flex:none;
    white-space:nowrap;
  }
  .refresh-btn:hover{background:var(--thead-bg);color:var(--ink);}
  .refresh-btn:disabled{opacity:.6;cursor:default;}

  footer{
    margin-top:24px;
    font-size:12px;
    color:var(--ink-soft);
    text-align:center;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">Daily Cleaning Routine</div>
    <div class="title-row">
      <h1>今日のそうじ・タスク</h1>
      <button type="button" class="refresh-btn" id="refreshBtn">最新の情報に更新</button>
    </div>
    <div class="today-date" id="todayDate"></div>
  </header>

  <div class="cards">
    <div class="card area">
      <div class="card-label"><span class="num" id="digitBadge">-</span>今日のエリア</div>
      <div class="card-body" id="todayArea">-</div>
    </div>
    <div class="card weekly">
      <div class="card-label"><span class="num" id="weekdayBadge">-</span>週間タスク</div>
      <div class="card-body" id="todayWeekly">-</div>
    </div>
    <div class="card monthly">
      <div class="card-label"><span class="num" id="monthlyBadge">-</span><span id="monthlyLabel">週末タスク</span></div>
      <div class="card-body" id="todayMonthly">-</div>
    </div>
  </div>

  <section class="table-section digit-section">
    <h2 class="section-title">10日ごとルーティン</h2>
    <div class="table-wrap">
      <table class="routine-table" id="digitTable">
        <tbody></tbody>
      </table>
    </div>
  </section>

  <section class="table-section weekly-section">
    <h2 class="section-title">週のルーティン</h2>
    <div class="table-wrap">
      <table class="routine-table" id="weeklyTable">
        <tbody></tbody>
      </table>
    </div>
  </section>

  <section class="table-section monthly-section">
    <h2 class="section-title">週末ローテーション<span class="section-note" id="monthlyNote"></span></h2>
    <div class="table-wrap">
      <table class="routine-table" id="monthlyTable">
        <tbody></tbody>
      </table>
    </div>
    <div class="monthly-tools">
      <button type="button" class="add-btn" id="addMonthlyBtn">＋ タスクを追加</button>
      <label class="epoch-field">基準日（土）<input type="date" id="epochInput"></label>
    </div>
  </section>

  <footer>作業内容・週間タスクの欄はクリックして編集できます。変更は自動保存され、他の端末にもリアルタイムで反映されます。</footer>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { initializeAppCheck, ReCaptchaV3Provider } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app-check.js";
  import { getDatabase, ref, set, get, onValue } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAWJJ90XGCWSR-heDAovpnhYYIxU7GqegI",
    authDomain: "souji-routine.firebaseapp.com",
    databaseURL: "https://souji-routine-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "souji-routine",
    storageBucket: "souji-routine.firebasestorage.app",
    messagingSenderId: "469055910050",
    appId: "1:469055910050:web:84bef90225bdcc98ad27fb"
  };
  const firebaseApp = initializeApp(firebaseConfig);

  // App Check: reCAPTCHA v3 で「このサイトから来たリクエストか」を検証する。
  // サイトキーは公開前提の値（Firebase Console > App Check で発行）。
  // 空のままなら App Check は初期化しない（未設定でアプリが壊れないようにするため）。
  // getDatabase より前に初期化する必要がある。
  const RECAPTCHA_SITE_KEY = "6LfVLW4tAAAAAED4z1mueN1GgC7fIbGBX601RZqT";
  if(RECAPTCHA_SITE_KEY){
    initializeAppCheck(firebaseApp, {
      provider: new ReCaptchaV3Provider(RECAPTCHA_SITE_KEY),
      isTokenAutoRefreshEnabled: true
    });
  }

  const db = getDatabase(firebaseApp);
  const rowsRef = ref(db, "rows");
  const monthlyRef = ref(db, "monthly");

  const STORAGE_KEY = "soujiRoutineRows";
  const MONTHLY_KEY = "soujiRoutineMonthly";

  // CSVをベースにしたデータ（初期値）
  const defaultRows = [
    { digit: "1", area: "靴を整理、たたき掃き掃除", weekday: "Mon", weekly: "捨て活" },
    { digit: "2", area: "リビング掃除機・床拭き", weekday: "Tue", weekly: "洗濯物たたみ" },
    { digit: "3", area: "クレシア,Nanox,ウォシュボン,アラウーノ", weekday: "Wed", weekly: "紙・布・プラスチック" },
    { digit: "4", area: "ダイニングテーブルリセット", weekday: "Thu", weekly: "燃えるゴミ" },
    { digit: "5", area: "シンクのリセット,Yogiboカバー交換", weekday: "Fri", weekly: "缶・びん・PET" },
    { digit: "6", area: "賞味期限チェック、庫内拭き", weekday: "Sat", weekly: "洗濯物たたみ" },
    { digit: "7", area: "洗い場、カビ取り、排水口、バスマジックリン", weekday: "Sun", weekly: "学校の準備、燃えるゴミ" },
    { digit: "8", area: "洗面ボウル", weekday: "", weekly: "" },
    { digit: "9", area: "トイレ、手洗い場", weekday: "", weekly: "" },
    { digit: "0", area: "シーツ交換、寝室そうじ", weekday: "", weekly: "" },
  ];

  // 週末ローテーションの初期値。epoch はこの土曜を tasks[0] とする基準日。
  const defaultMonthly = {
    epoch: "2026-08-01",
    tasks: ["タスク1","タスク2","タスク3","タスク4","タスク5","タスク6","タスク7","タスク8"]
  };

  function isValidRows(saved){
    return Array.isArray(saved) && saved.length === defaultRows.length &&
      saved.every((r,i) => r && r.digit === defaultRows[i].digit && r.weekday === defaultRows[i].weekday);
  }

  function isValidMonthly(v){
    return !!(v && typeof v.epoch === "string" && /^\d{4}-\d{2}-\d{2}$/.test(v.epoch) &&
      Array.isArray(v.tasks) && v.tasks.length > 0 && v.tasks.every(t => typeof t === "string"));
  }

  function loadCachedRows(){
    try{
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if(isValidRows(saved)) return saved;
    }catch(e){}
    return defaultRows.map(r => ({...r}));
  }

  function loadCachedMonthly(){
    try{
      const saved = JSON.parse(localStorage.getItem(MONTHLY_KEY));
      if(isValidMonthly(saved)) return saved;
    }catch(e){}
    return { epoch: defaultMonthly.epoch, tasks: defaultMonthly.tasks.slice() };
  }

  let rows = loadCachedRows();
  let monthly = loadCachedMonthly();
  let todayInfo = null;
  let writeTimer = null;
  let monthlyWriteTimer = null;
  let lastRenderedKey = null;

  function cacheRows(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(rows));
  }

  function cacheMonthly(){
    localStorage.setItem(MONTHLY_KEY, JSON.stringify(monthly));
  }

  function pushRows(){
    cacheRows();
    clearTimeout(writeTimer);
    writeTimer = setTimeout(() => set(rowsRef, rows), 400);
  }

  function pushMonthly(){
    cacheMonthly();
    clearTimeout(monthlyWriteTimer);
    monthlyWriteTimer = setTimeout(() => set(monthlyRef, monthly), 400);
  }

  async function pullRows(){
    const snapshot = await get(rowsRef);
    const val = snapshot.val();
    if(isValidRows(val)){
      rows = val;
      cacheRows();
    }
  }

  async function pullMonthly(){
    const snapshot = await get(monthlyRef);
    const val = snapshot.val();
    if(isValidMonthly(val)){
      monthly = val;
      cacheMonthly();
    }
  }

  function isEditingCell(){
    const el = document.activeElement;
    return !!(el && el.hasAttribute("contenteditable") && el.closest(".routine-table"));
  }

  const weekdayJa = ["日","月","火","水","木","金","土"];

  function getTodayInfo(){
    const now = new Date();
    const day = now.getDate();          // 1-31
    const lastDigit = String(day % 10); // "0"-"9"
    const dow = now.getDay();           // 0=Sun ... 6=Sat
    const weekdayCodes = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
    return {
      now,
      lastDigit,
      weekdayCode: weekdayCodes[dow],
      weekdayJa: weekdayJa[dow]
    };
  }

  function formatDate(d){
    const y = d.getFullYear();
    const m = d.getMonth()+1;
    const day = d.getDate();
    const w = weekdayJa[d.getDay()];
    return `${y}年${m}月${day}日（${w}）`;
  }

  function dateKey(d){
    return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
  }

  // --- 週末ローテーション -------------------------------------------------
  // 進捗はどこにも保存せず、基準日からの経過だけで「今の担当」を決める。
  // どの端末でも同じ答えになるので、二重進行も取りこぼしも起きない。

  // 夏時間のある地域でもズレないよう、日付部分だけを通し番号にする
  function dayNumber(d){
    return Math.round(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
  }

  // 土日で1枚を共有する。日曜は直前の土曜と同じ週末として数えるので、
  // 土曜にできなかったタスクが日曜にもそのまま残る。
  function weekendTicket(d){
    const dow = d.getDay();
    if(dow !== 0 && dow !== 6) return null;
    const sat = new Date(d);
    if(dow === 0) sat.setDate(sat.getDate() - 1);
    const [y, m, day] = monthly.epoch.split("-").map(Number);
    return Math.floor((dayNumber(sat) - dayNumber(new Date(y, m-1, day))) / 7);
  }

  // 週末なら今週末の担当、平日なら次の週末の担当を返す
  function monthlyState(now){
    const tasks = monthly.tasks;
    if(!tasks || !tasks.length) return null;
    const dow = now.getDay();
    const isWeekend = (dow === 0 || dow === 6);
    const target = new Date(now);
    if(!isWeekend) target.setDate(target.getDate() + ((6 - dow + 7) % 7));
    const ticket = weekendTicket(target);
    if(ticket === null) return null;
    const index = ((ticket % tasks.length) + tasks.length) % tasks.length;
    return { isWeekend, index, target };
  }

  function updateCards(){
    const areaRow = rows.find(r => r.digit === todayInfo.lastDigit);
    const weeklyRow = rows.find(r => r.weekday === todayInfo.weekdayCode);

    document.getElementById("digitBadge").textContent = todayInfo.lastDigit;
    document.getElementById("todayArea").textContent = areaRow && areaRow.area ? areaRow.area : "該当なし";

    document.getElementById("weekdayBadge").textContent = todayInfo.weekdayJa;
    document.getElementById("todayWeekly").textContent = (weeklyRow && weeklyRow.weekly) ? weeklyRow.weekly : "該当なし";

    updateMonthlyCard();
  }

  function updateMonthlyCard(){
    const card = document.querySelector(".card.monthly");
    const badge = document.getElementById("monthlyBadge");
    const label = document.getElementById("monthlyLabel");
    const body = document.getElementById("todayMonthly");
    const st = monthlyState(todayInfo.now);

    // 週末カードは金土日だけ出す。月〜木は隠して2列に戻す。
    const dow = todayInfo.now.getDay();          // 0=日 ... 6=土
    const show = (dow === 5 || dow === 6 || dow === 0);
    card.hidden = !show;
    document.querySelector(".cards").classList.toggle("with-monthly", show);
    if(!show) return;

    if(!st){
      badge.textContent = "-";
      label.textContent = "週末タスク";
      body.textContent = "該当なし";
      return;
    }
    badge.textContent = String(st.index + 1);
    label.textContent = st.isWeekend ? "週末タスク" : `次の週末（${formatWeekendRange(st.target)}）`;
    body.textContent = monthly.tasks[st.index] || "未設定";
  }

  // 土日ひとまとめの表記。月をまたぐ週末は月も添える（例 8/29〜30 / 10/31〜11/1）
  function formatWeekendRange(sat){
    const sun = new Date(sat);
    sun.setDate(sun.getDate() + 1);
    const head = `${sat.getMonth()+1}/${sat.getDate()}`;
    return sun.getMonth() === sat.getMonth()
      ? `${head}〜${sun.getDate()}`
      : `${head}〜${sun.getMonth()+1}/${sun.getDate()}`;
  }

  function renderTables(){
    const digitBody = document.querySelector("#digitTable tbody");
    const weeklyBody = document.querySelector("#weeklyTable tbody");
    digitBody.innerHTML = "";
    weeklyBody.innerHTML = "";

    rows.forEach((r, i) => {
      const tr = document.createElement("tr");
      tr.dataset.index = i;
      if(r.digit === todayInfo.lastDigit) tr.classList.add("today-row");
      tr.innerHTML = `
        <td class="digit-col">${r.digit}</td>
        <td class="editable" contenteditable="true" data-field="area">${r.area}</td>
      `;
      digitBody.appendChild(tr);
    });

    // 曜日が割り当てられている行だけを週の表に出す（8・9・0 の行は曜日を持たない）
    rows.forEach((r, i) => {
      if(!r.weekday) return;
      const tr = document.createElement("tr");
      tr.dataset.index = i;
      if(r.weekday === todayInfo.weekdayCode) tr.classList.add("today-weekday");
      tr.innerHTML = `
        <td class="weekday-col">${r.weekday}</td>
        <td class="editable weekly-col" contenteditable="true" data-field="weekly">${r.weekly}</td>
      `;
      weeklyBody.appendChild(tr);
    });
  }

  function renderMonthlyTable(){
    const tbody = document.querySelector("#monthlyTable tbody");
    const st = monthlyState(todayInfo.now);
    tbody.innerHTML = "";

    monthly.tasks.forEach((task, i) => {
      const tr = document.createElement("tr");
      tr.dataset.index = i;
      // 週末は今週末の担当、平日は次の週末の担当に網掛けする
      if(st && st.index === i) tr.classList.add("today-monthly");

      const numTd = document.createElement("td");
      numTd.className = "digit-col";
      numTd.textContent = String(i + 1);

      // textContent で入れて、タスク名が HTML として解釈されないようにする
      const taskTd = document.createElement("td");
      taskTd.className = "editable";
      taskTd.contentEditable = "true";
      taskTd.dataset.mfield = "task";
      taskTd.textContent = task;

      const delTd = document.createElement("td");
      delTd.className = "del-col";
      const del = document.createElement("button");
      del.type = "button";
      del.className = "del-btn";
      del.title = "この行を削除";
      del.textContent = "×";
      delTd.appendChild(del);

      tr.append(numTd, taskTd, delTd);
      tbody.appendChild(tr);
    });

    const n = monthly.tasks.length;
    document.getElementById("monthlyNote").textContent = `${n}件 / 一巡 ${n}週`;

    const epochInput = document.getElementById("epochInput");
    if(document.activeElement !== epochInput) epochInput.value = monthly.epoch;
  }

  function render(){
    todayInfo = getTodayInfo();
    lastRenderedKey = dateKey(todayInfo.now);
    document.getElementById("todayDate").textContent = formatDate(todayInfo.now);
    updateCards();
    renderTables();
    renderMonthlyTable();
  }

  function applyTheme(){
    const hour = Number(new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Tokyo",hour:"numeric",hourCycle:"h23"}).format(new Date()));
    const isDark = (hour >= 18 || hour < 6);
    document.documentElement.dataset.theme = isDark ? "dark" : "light";
    document.getElementById("themeColorMeta").setAttribute("content", isDark ? "#1C1B17" : "#5F8265");
  }
  applyTheme();
  setInterval(applyTheme, 60000);

  // 日付が変わった直後（毎日0時1分）に、表示とデータを明示的に更新する
  const REFRESH_HOUR = 0;
  const REFRESH_MINUTE = 1;
  let midnightTimer = null;

  function msUntilNextRefresh(){
    const now = new Date();
    const next = new Date(now);
    next.setHours(REFRESH_HOUR, REFRESH_MINUTE, 0, 0);
    if(next <= now) next.setDate(next.getDate() + 1);
    return next - now;
  }

  async function refreshSchedule(){
    try{
      await Promise.all([pullRows(), pullMonthly()]);
    }catch(e){
      console.error("Scheduled refresh failed:", e);
    }
    if(!isEditingCell()) render();
  }

  function scheduleMidnightRefresh(){
    clearTimeout(midnightTimer);
    midnightTimer = setTimeout(() => {
      refreshSchedule();
      scheduleMidnightRefresh();
    }, msUntilNextRefresh());
  }
  scheduleMidnightRefresh();

  // 端末のスリープ等でタイマーが遅延・停止した場合に備え、復帰時に日付ズレを補正する
  document.addEventListener("visibilitychange", () => {
    if(document.visibilityState !== "visible") return;
    applyTheme();
    if(lastRenderedKey !== dateKey(new Date())) refreshSchedule();
    scheduleMidnightRefresh();
  });

  // tbody は再描画で中身だけ差し替えるので、tbody 自体に付けたリスナーは生き続ける
  document.querySelectorAll("#digitTable tbody, #weeklyTable tbody").forEach((tbody) => {
    tbody.addEventListener("input", (e) => {
      const td = e.target.closest("td[data-field]");
      if(!td) return;
      const tr = td.closest("tr");
      const idx = Number(tr.dataset.index);
      rows[idx][td.dataset.field] = td.textContent.trim();
      updateCards();
      pushRows();
    });

    tbody.addEventListener("keydown", (e) => {
      if(e.key === "Enter" && e.target.closest("td[data-field]")){
        e.preventDefault();
        e.target.blur();
      }
    });
  });

  const monthlyBody = document.querySelector("#monthlyTable tbody");

  monthlyBody.addEventListener("input", (e) => {
    const td = e.target.closest("td[data-mfield]");
    if(!td) return;
    const idx = Number(td.closest("tr").dataset.index);
    monthly.tasks[idx] = td.textContent.trim();
    updateMonthlyCard();
    pushMonthly();
  });

  monthlyBody.addEventListener("keydown", (e) => {
    if(e.key === "Enter" && e.target.closest("td[data-mfield]")){
      e.preventDefault();
      e.target.blur();
    }
  });

  monthlyBody.addEventListener("click", (e) => {
    if(!e.target.closest(".del-btn")) return;
    // 0件になると担当を決められなくなるので、最後の1件は残す
    if(monthly.tasks.length <= 1) return;
    const idx = Number(e.target.closest("tr").dataset.index);
    monthly.tasks.splice(idx, 1);
    pushMonthly();
    render();
  });

  document.getElementById("addMonthlyBtn").addEventListener("click", () => {
    monthly.tasks.push("");
    pushMonthly();
    render();
    const cells = document.querySelectorAll("#monthlyTable td[data-mfield]");
    if(cells.length) cells[cells.length - 1].focus();
  });

  document.getElementById("epochInput").addEventListener("change", (e) => {
    if(!/^\d{4}-\d{2}-\d{2}$/.test(e.target.value)){
      e.target.value = monthly.epoch;
      return;
    }
    monthly.epoch = e.target.value;
    pushMonthly();
    render();
  });

  document.getElementById("refreshBtn").addEventListener("click", async () => {
    const btn = document.getElementById("refreshBtn");
    btn.disabled = true;
    const originalLabel = btn.textContent;
    try{
      await Promise.all([pullRows(), pullMonthly()]);
      render();
      btn.textContent = "更新しました";
    }catch(e){
      console.error("Refresh failed:", e);
      btn.textContent = "更新に失敗しました";
    }finally{
      setTimeout(() => { btn.textContent = originalLabel; btn.disabled = false; }, 1200);
    }
  });

  onValue(rowsRef, (snapshot) => {
    const val = snapshot.val();
    if(isValidRows(val)){
      rows = val;
      cacheRows();
      if(!isEditingCell()) render();
    }else if(val === null){
      // サーバー側に未初期化の場合は現在の値で作成
      set(rowsRef, rows);
    }
  }, (error) => console.error("Firebase sync error:", error));

  onValue(monthlyRef, (snapshot) => {
    const val = snapshot.val();
    if(isValidMonthly(val)){
      monthly = val;
      cacheMonthly();
      if(!isEditingCell()) render();
    }else if(val === null){
      // サーバー側に未初期化の場合は現在の値で作成
      set(monthlyRef, monthly);
    }
  }, (error) => console.error("Firebase monthly sync error:", error));

  render();
</script>
<script>
  if("serviceWorker" in navigator){
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch((e) => console.error("SW registration failed:", e));
    });
  }
</script>
</body>
</html>
